include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A design system's API reference is a deliverable, not a nicety.
    public_member_api_docs: error
  exclude:
    - "**/*.g.dart"
    - "**/*.directories.g.dart"

linter:
  rules:
    public_member_api_docs: true
    # The catalog and tests read better with relative imports disabled.
    always_use_package_imports: true
    prefer_relative_imports: false
    # Flutter's own convention for interpolation is a static `lerp` method
    # (Color.lerp, TextStyle.lerp, ThemeExtension.lerp). Matching it is more
    # valuable here than satisfying this lint.
    prefer_constructors_over_static_methods: false
