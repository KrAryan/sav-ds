name: sav_catalog
description: >-
  Web catalog for the Sav design system. Deployed to GitHub Pages so the whole
  org can browse components, states, and specs without running Flutter.
publish_to: none
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # Path dependency, not hosted: the package sets `publish_to: none` while a
  # distribution target is still being chosen.
  sav_design_system:
    path: ../../packages/sav_design_system
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0
  widgetbook_generator: ^3.24.0

flutter:
  uses-material-design: true
